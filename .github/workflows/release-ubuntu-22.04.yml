name: Release Ubuntu 22.04 binaries

on:
  push:
    branches:
      - release/ubuntu-22.04-v6.3.5-protei.1

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: 4edebf42003aaeebfafe228ec161ba237956d102
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y remove libzstd-dev || true
          sudo apt-get -y install \
            build-essential \
            pkg-config \
            uuid-dev \
            libcurl4-openssl-dev \
            libbz2-dev \
            zlib1g-dev \
            libsnappy-dev \
            liblz4-dev \
            libzstd-dev \
            libssl-dev

      - name: Build KeyDB
        run: |
          make BUILD_TLS=yes -j"$(nproc)" \
            KEYDB_CFLAGS='-O2 -g -Wno-error=infinite-recursion' \
            KEYDB_CXXFLAGS='-O2 -g -Wno-error=infinite-recursion'

      - name: Package binaries
        run: |
          set -euxo pipefail
          version='6.3.5-protei.1'
          package="keydb-${version}-ubuntu-22.04-amd64"
          mkdir -p "dist/${package}/bin"

          install -m 0755 src/keydb-server "dist/${package}/bin/"
          install -m 0755 src/keydb-cli "dist/${package}/bin/"
          install -m 0755 src/keydb-benchmark "dist/${package}/bin/"
          install -m 0755 src/keydb-check-aof "dist/${package}/bin/"
          install -m 0755 src/keydb-check-rdb "dist/${package}/bin/"
          ln -s keydb-server "dist/${package}/bin/keydb-sentinel"

          cp COPYING README.md "dist/${package}/"
          {
            echo "Release: v${version}"
            echo "Source commit: 4edebf42003aaeebfafe228ec161ba237956d102"
            echo "Build image: ubuntu-22.04"
            echo "Architecture: amd64"
            echo "TLS: enabled"
            echo
            echo "Runtime dependencies:"
            for binary in dist/${package}/bin/keydb-server dist/${package}/bin/keydb-cli dist/${package}/bin/keydb-benchmark; do
              echo
              echo "[$binary]"
              ldd "$binary"
            done
          } > "dist/${package}/BUILD-INFO.txt"

          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          sha256sum "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"

      - name: Smoke test
        run: |
          src/keydb-server --version
          src/keydb-cli --version
          src/keydb-server --save '' --appendonly no --daemonize yes --port 6399 --pidfile /tmp/keydb-release.pid
          for i in $(seq 1 20); do
            if src/keydb-cli -p 6399 ping | grep -q PONG; then
              break
            fi
            sleep 0.5
          done
          test "$(src/keydb-cli -p 6399 ping)" = PONG
          src/keydb-cli -p 6399 shutdown nosave

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v6.3.5-protei.1 \
            --repo "${{ github.repository }}" \
            --target 4edebf42003aaeebfafe228ec161ba237956d102 \
            --title "KeyDB 6.3.5-protei.1" \
            --notes $'Ubuntu 22.04 amd64 build of KeyDB 6.3.5 with the cached-master lifecycle and AsyncWorkQueue fork-lock deadlock fixes.\n\nIncluded binaries:\n- keydb-server\n- keydb-sentinel\n- keydb-cli\n- keydb-benchmark\n- keydb-check-aof\n- keydb-check-rdb\n\nBuild options: TLS enabled, optimized release build.\nSource commit: 4edebf42003aaeebfafe228ec161ba237956d102' \
            dist/keydb-6.3.5-protei.1-ubuntu-22.04-amd64.tar.gz \
            dist/keydb-6.3.5-protei.1-ubuntu-22.04-amd64.tar.gz.sha256
