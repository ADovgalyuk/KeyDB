name: Apply cached master lifecycle fix

on:
  push:
    branches:
      - agent/fix-cached-master-lifecycle

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply lifecycle fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/replication.cpp")
          text = path.read_text()

          replacements = [
              (
                  """void replicationCreateMasterClient(redisMaster *mi, connection *conn, int dbid) {\n    serverAssert(mi->master == nullptr);\n    mi->master = createClient(conn, serverTL - g_pserver->rgthreadvar);\n    if (mi->cached_master != nullptr) {\n        freeClientAsync(mi->cached_master);\n        mi->cached_master = nullptr;\n    }\n""",
                  """void replicationCreateMasterClient(redisMaster *mi, connection *conn, int dbid) {\n    serverAssert(mi->master == nullptr);\n    replicationDiscardCachedMaster(mi);\n    serverAssert(mi->cached_master == nullptr);\n    mi->master = createClient(conn, serverTL - g_pserver->rgthreadvar);\n""",
              ),
              (
                  """    if (mi->cached_master != nullptr)\n    {\n        // This can happen on first load of the RDB, the master we created in config load is stale\n        freeClient(mi->cached_master);\n    }\n\n    /* This will be used to populate the field g_pserver->master->reploff\n""",
                  """    /* This can happen on first load of the RDB, when the master\n     * created during config loading is stale. */\n    replicationDiscardCachedMaster(mi);\n\n    /* This will be used to populate the field g_pserver->master->reploff\n""",
              ),
              (
                  """void replicationCacheMasterUsingMaster(redisMaster *mi) {\n    if (mi->cached_master) {\n        freeClient(mi->cached_master);\n    }\n\n    replicationCreateMasterClient(mi, NULL, -1);\n""",
                  """void replicationCacheMasterUsingMaster(redisMaster *mi) {\n    replicationDiscardCachedMaster(mi);\n\n    replicationCreateMasterClient(mi, NULL, -1);\n""",
              ),
              (
                  """void replicationDiscardCachedMaster(redisMaster *mi) {\n    if (mi->cached_master == NULL) return;\n\n    serverLog(LL_NOTICE,\"Discarding previously cached master state.\");\n    mi->cached_master->flags &= ~CLIENT_MASTER;\n    freeClientAsync(mi->cached_master);\n    mi->cached_master = NULL;\n}\n""",
                  """void replicationDiscardCachedMaster(redisMaster *mi) {\n    client *cached = mi->cached_master;\n    if (cached == nullptr) return;\n\n    serverLog(LL_NOTICE,\"Discarding previously cached master state.\");\n\n    /* Transfer ownership before scheduling the client for asynchronous free.\n     * No later replication transition may observe the queued client through\n     * mi->cached_master. */\n    mi->cached_master = nullptr;\n    cached->flags &= ~CLIENT_MASTER;\n    freeClientAsync(cached);\n}\n""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, found {count}: {old.splitlines()[0]}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          rm .github/workflows/apply-cached-master-fix.yml
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix cached master ownership lifecycle"
          git push origin HEAD:agent/fix-cached-master-lifecycle
