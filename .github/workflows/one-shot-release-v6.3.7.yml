name: One-shot publish verified KeyDB 6.3.7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/one-shot-release-v6.3.7.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: keydb-v6.3.7-release
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 33e4d629535e1d610e33e7e7e8ccf4938e2015a9
  RELEASE_TAG: v6.3.7
  VERSION: 6.3.7
  RELEASE_ID: '420732335'
  BUILD_RUN_ID: '39782872003'

jobs:
  publish:
    name: Verify uploaded assets and publish KeyDB 6.3.7
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Verify all target build jobs succeeded
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" > jobs.json
          python3 - <<'PY'
          import json, pathlib
          jobs = json.loads(pathlib.Path('jobs.json').read_text())['jobs']
          expected = {'Build and verify ' + t for t in (
              'ubuntu-22.04-amd64', 'oraclelinux-8-x86_64', 'oraclelinux-9-x86_64')}
          selected = [j for j in jobs if j['name'] in expected]
          assert {j['name'] for j in selected} == expected
          assert all(j['conclusion'] == 'success' for j in selected)
          print('All three source build, regression and clean-runtime jobs passed.')
          PY

      - name: Download the existing validated packages
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}
          pattern: keydb-6.3.7-*
          merge-multiple: true
          path: dist

      - name: Verify uploaded digests and publish the draft by ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          for target in ubuntu-22.04-amd64 oraclelinux-8-x86_64 oraclelinux-9-x86_64; do
            archive="keydb-$VERSION-$target.tar.gz"
            test -s "$archive"
            test -s "$archive.sha256"
            sha256sum -c "$archive.sha256"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          test "$(jq -r .tag_name release.json)" = "$RELEASE_TAG"
          test "$(jq -r .target_commitish release.json)" = "$SOURCE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" > assets.json
          python3 - <<'PY'
          import hashlib, json, pathlib
          files = sorted([*pathlib.Path('.').glob('*.tar.gz'), *pathlib.Path('.').glob('*.tar.gz.sha256')])
          assets = json.loads(pathlib.Path('assets.json').read_text())
          assert len(files) == 6 and len(assets) == 6
          by_name = {a['name']: a for a in assets}
          assert set(by_name) == {p.name for p in files}
          for path in files:
              asset = by_name[path.name]
              assert asset['size'] == path.stat().st_size
              expected = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              assert asset.get('digest') == expected, 'Uploaded digest mismatch: ' + path.name
              print('Uploaded asset verified:', path.name, expected)
          PY
          if test "$(jq -r .draft release.json)" = true; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false -f make_latest=true > published.json
          else
            cp release.json published.json
          fi
          test "$(jq -r .draft published.json)" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_COMMIT"
          jq -r '.html_url' published.json
