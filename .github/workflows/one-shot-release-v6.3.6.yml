name: One-shot KeyDB 6.3.6 Ubuntu 22.04 release

on:
  push:
    branches: [main]
    paths:
      - .github/release-v6.3.6

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e78a02c171d04f7221630cbfce977ec999134656
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential \
            pkg-config \
            libsystemd-dev \
            uuid-dev \
            libcurl4-openssl-dev \
            libbz2-dev \
            zlib1g-dev \
            libsnappy-dev \
            liblz4-dev \
            libzstd-dev \
            libssl-dev

      - name: Build with systemd support
        run: |
          make BUILD_TLS=yes USE_SYSTEMD=yes -j"$(nproc)"

      - name: Validate version and systemd linkage
        run: |
          set -euxo pipefail
          src/keydb-server --version | tee /tmp/keydb-version.txt
          grep -q '6\.3\.6' /tmp/keydb-version.txt
          ldd src/keydb-server | tee /tmp/keydb-ldd.txt
          grep -q 'libsystemd\.so\.0' /tmp/keydb-ldd.txt

      - name: Verify systemd READY notification
        run: |
          set -euxo pipefail
          rm -f /tmp/keydb-notify.sock /tmp/keydb-notify.log /tmp/keydb-release.log

          python3 - <<'PY' &
          import os
          import socket

          path = "/tmp/keydb-notify.sock"
          sock = socket.socket(socket.AF_UNIX, socket.SOCK_DGRAM)
          sock.bind(path)
          sock.settimeout(30)

          with open("/tmp/keydb-notify.log", "w", encoding="utf-8") as output:
              while True:
                  message = sock.recv(4096).decode("utf-8", errors="replace")
                  output.write(message + "\n")
                  output.flush()
                  if "READY=1" in message:
                      break
          PY
          notify_pid=$!

          NOTIFY_SOCKET=/tmp/keydb-notify.sock \
            src/keydb-server \
              --save '' \
              --appendonly no \
              --daemonize no \
              --supervised systemd \
              --port 6399 \
              --pidfile /tmp/keydb-release.pid \
              > /tmp/keydb-release.log 2>&1 &
          server_pid=$!

          wait "$notify_pid"
          grep -q 'READY=1' /tmp/keydb-notify.log
          test "$(src/keydb-cli -p 6399 ping)" = PONG
          src/keydb-cli -p 6399 shutdown nosave
          wait "$server_pid"

      - name: Package binaries
        run: |
          set -euxo pipefail
          package=keydb-6.3.6-ubuntu-22.04-amd64
          mkdir -p "dist/${package}/bin"

          for binary in keydb-server keydb-cli keydb-benchmark keydb-check-aof keydb-check-rdb; do
            install -m 0755 "src/${binary}" "dist/${package}/bin/"
          done
          ln -s keydb-server "dist/${package}/bin/keydb-sentinel"
          cp COPYING README.md "dist/${package}/"

          {
            echo 'Release: v6.3.6'
            echo 'Source commit: e78a02c171d04f7221630cbfce977ec999134656'
            echo 'Build image: ubuntu-22.04'
            echo 'Architecture: amd64'
            echo 'TLS: enabled'
            echo 'systemd notify: enabled'
            echo
            src/keydb-server --version
            echo
            ldd "dist/${package}/bin/keydb-server"
          } > "dist/${package}/BUILD-INFO.txt"

          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          sha256sum "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v6.3.6 \
            --repo "${{ github.repository }}" \
            --target e78a02c171d04f7221630cbfce977ec999134656 \
            --title 'KeyDB 6.3.6' \
            --notes $'Custom KeyDB 6.3.6 build for Ubuntu 22.04 amd64.\n\nContains the cached-master lifecycle and AsyncWorkQueue fork-lock deadlock fixes. TLS and native systemd notify support are enabled. The workflow verifies the reported version, linkage to libsystemd.so.0, READY=1 notification, and a PING/PONG smoke test.' \
            dist/keydb-6.3.6-ubuntu-22.04-amd64.tar.gz \
            dist/keydb-6.3.6-ubuntu-22.04-amd64.tar.gz.sha256

      - name: Remove one-shot release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/one-shot-release-v6.3.6.yml .github/release-v6.3.6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-shot KeyDB 6.3.6 release workflow'
          git push origin main
