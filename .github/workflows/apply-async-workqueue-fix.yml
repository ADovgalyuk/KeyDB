name: Apply AsyncWorkQueue fork deadlock fix

on:
  push:
    branches:
      - agent/fix-async-workqueue-fork-deadlock

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply lock ordering fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/AsyncWorkQueue.cpp")
          text = path.read_text()

          old = """    while (!m_fQuitting)\n    {\n        std::unique_lock<std::mutex> lock(m_mutex);\n        if (m_workqueue.empty())\n            m_cvWakeup.wait(lock);\n\n        aeThreadOnline();\n        while (!m_workqueue.empty())\n        {\n            WorkItem task = std::move(m_workqueue.front());\n            m_workqueue.pop_front();\n\n            lock.unlock();\n            serverTL->gcEpoch = g_pserver->garbageCollector.startEpoch();\n            task.fnAsync();\n            g_pserver->garbageCollector.endEpoch(serverTL->gcEpoch);\n            lock.lock();\n        }\n\n        lock.unlock();\n        serverTL->gcEpoch = g_pserver->garbageCollector.startEpoch();\n        if (listLength(serverTL->clients_pending_asyncwrite)) {\n            aeAcquireLock();\n            ProcessPendingAsyncWrites();\n            aeReleaseLock();\n        }\n        g_pserver->garbageCollector.endEpoch(serverTL->gcEpoch);\n        serverTL->gcEpoch.reset();\n        aeThreadOffline();\n    }\n"""

          new = """    while (true)\n    {\n        std::unique_lock<std::mutex> lock(m_mutex);\n        m_cvWakeup.wait(lock, [this] {\n            return m_fQuitting || !m_workqueue.empty();\n        });\n\n        if (m_fQuitting)\n            break;\n\n        /* Never wait for the fork read lock while holding m_mutex. Another\n         * worker can already hold the fork lock and need m_mutex to finish,\n         * while a background save is waiting for the fork write lock. */\n        lock.unlock();\n        aeThreadOnline();\n        lock.lock();\n\n        while (!m_workqueue.empty())\n        {\n            WorkItem task = std::move(m_workqueue.front());\n            m_workqueue.pop_front();\n\n            lock.unlock();\n            serverTL->gcEpoch = g_pserver->garbageCollector.startEpoch();\n            task.fnAsync();\n            g_pserver->garbageCollector.endEpoch(serverTL->gcEpoch);\n            lock.lock();\n        }\n\n        lock.unlock();\n        serverTL->gcEpoch = g_pserver->garbageCollector.startEpoch();\n        if (listLength(serverTL->clients_pending_asyncwrite)) {\n            aeAcquireLock();\n            ProcessPendingAsyncWrites();\n            aeReleaseLock();\n        }\n        g_pserver->garbageCollector.endEpoch(serverTL->gcEpoch);\n        serverTL->gcEpoch.reset();\n        aeThreadOffline();\n    }\n"""

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one WorkerThreadMain loop, found {count}")

          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/apply-async-workqueue-fix.yml
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix AsyncWorkQueue fork lock ordering"
          git push origin HEAD:agent/fix-async-workqueue-fork-deadlock
